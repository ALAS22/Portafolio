<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="personal">
  <div id="app"></div>

  <script src="js/content.js"></script>
  <script>
    // Un ícono SVG de línea por cada tipo de contacto.
    // LinkedIn no es un SVG sino una insignia con texto "in", igual que en el diseño.
    const ICONS = {
      mail: `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
      github: `<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
      phone: `<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
    };

    window.renderMain = function (t) {
      const items = t.personal.items
        .map((item) => {
          const iconHtml =
            item.icon === "linkedin"
              ? `<span class="contact-icon linkedin-badge">in</span>`
              : `<span class="contact-icon">${ICONS[item.icon] || ""}</span>`;
          return `<div class="contact-item">${iconHtml}<span>${item.label}: ${item.value}</span></div>`;
        })
        .join("");

      return `
        <div class="top-bar">
          <a class="back-link" href="index.html">← ${t.nav.home}</a>
          <button class="lang-toggle" onclick="toggleLang()" aria-label="Switch language">
            ${t.langToggle}
          </button>
        </div>

        <div class="contact-frame">
          <h1 class="contact-heading">${t.personal.heading}</h1>
          <div class="contact-list">${items}</div>
        </div>
      `;
    };
  </script>
  <script src="js/I18n.js"></script>
</body>
</html>
