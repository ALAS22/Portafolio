<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curriculum vitae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="cv">
  <div id="app"></div>

  <script src="js/content.js"></script>
  <script>
    window.renderMain = function (t) {
      const fields = t.cv.fields
        .map((f) => `<p>${f.label}: ${f.value}</p>`)
        .join("");

      return `
        <div class="top-bar">
          <a class="back-link" href="index.html">← ${t.nav.home}</a>
          <button class="lang-toggle" onclick="toggleLang()" aria-label="Switch language">
            ${t.langToggle}
          </button>
        </div>

        <div class="cv-frame">
          <img class="cv-photo" src="assets/img/cvimg.png" alt="${t.cv.pageTitle}" />
          <div class="cv-content">
            <div class="cv-header">
              <h1>${t.cv.pageTitle}</h1>
            </div>
            <div class="cv-details">
              ${fields}
              <a class="cv-download-btn" href="${t.cv.downloadUrl}" target="_blank" rel="noopener">
                ${t.cv.downloadLabel}
              </a>
            </div>
          </div>
        </div>
      `;
    };
  </script>
  <script src="js/I18n.js"></script>
</body>
</html>
