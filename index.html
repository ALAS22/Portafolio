<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <div class="hero">
    <div id="app"></div>
  </div>

  <script src="js/content.js"></script>
  <script>
    window.renderMain = function (t) {
      const pages = [
        { key: "about", href: "sobremi.html" },
        { key: "schedule", href: "horario.html" },
        { key: "cv", href: "cv.html" },
        { key: "personal", href: "contacto.html" },
      ];
      const nav = pages
        .map((p) => `<a class="nav-btn" href="${p.href}">${t.nav[p.key]}</a>`)
        .join("");

      return `
        <div class="hero-grid">
          <div class="avatar">
            <img src="assets/img/profile.jpeg" alt="${t.person.name}" />
          </div>
          <div class="hero-content">
            <h1 class="person-name">${t.person.name}</h1>
            <p class="person-role">${t.person.role}</p>
            <nav class="nav-stack">${nav}</nav>
            <button class="lang-toggle" onclick="toggleLang()" aria-label="Switch language">
              ${t.langToggle}
            </button>
          </div>
        </div>
      `;
    };
  </script>
  <script src="js/I18n.js"></script>
</body>
</html>
